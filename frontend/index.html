<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>源代码智能问答 — RAG</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- Left Sidebar: History -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">问答记录</div>
      <div class="sidebar-subtitle">本次会话</div>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-empty">还没有提问，<br>输入问题开始</div>
    </div>
  </aside>

  <!-- Center: Chat -->
  <div id="main-col">
    <header>
      <div class="header-inner">
        <div class="header-brand">
          <div class="header-icon">{ }</div>
          <div>
            <div class="header-title">源代码问答</div>
            <div class="header-subtitle">RAG Code Intelligence</div>
          </div>
        </div>
        <div class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">检测中...</span>
        </div>
      </div>
    </header>

    <main id="messages">
      <div class="welcome-mini" id="welcome-mini">
        <span class="welcome-mini-icon">&#x276F;_</span>
        代码分析助手 — 可询问本项目的分块、检索融合、上下文组装与接口实现
      </div>
    </main>

    <footer>
      <div class="input-wrap">
        <button id="mic-btn" title="按住说话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <textarea id="input" placeholder="询问关于项目代码的问题..." rows="1"></textarea>
        <button id="stop-btn" title="停止生成" style="display:none" onclick="window.chatApp.abort()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
        <button id="send-btn" title="发送 (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 按住 🎤 语音输入 · 停止按钮中断生成</div>
    </footer>
  </div>

  <!-- Right Panel: Quick Questions -->
  <aside id="right-panel">
    <div class="panel-header">
      <div class="panel-title">快捷提问</div>
      <div class="panel-subtitle">点击直接发送</div>
    </div>
    <div class="panel-body">
      <div class="panel-section">
        <div class="panel-section-title">快速入门</div>
        <button class="panel-chip" onclick="askExample(this)">这个项目怎么建索引？</button>
        <button class="panel-chip" onclick="askExample(this)">项目的整体架构分几层，各在哪几个目录？</button>
        <button class="panel-chip" onclick="askExample(this)">语料目录不在默认位置时怎么指定？</button>
        <button class="panel-chip" onclick="askExample(this)">支持哪些文件类型？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">检索与分块</div>
        <button class="panel-chip" onclick="askExample(this)">BM25 和向量检索是怎么融合的？</button>
        <button class="panel-chip" onclick="askExample(this)">RRF 公式里的 k 是多少，来源加权是做什么的？</button>
        <button class="panel-chip" onclick="askExample(this)">Python 文件是怎么按函数和类切块的？</button>
        <button class="panel-chip" onclick="askExample(this)">WXSS 和 JSON 为什么整文件一块？</button>
        <button class="panel-chip" onclick="askExample(this)">同一个文件最多保留几个块，为什么？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">上下文组装</div>
        <button class="panel-chip" onclick="askExample(this)">上下文 32K 预算是怎么分配的？</button>
        <button class="panel-chip" onclick="askExample(this)">单个文件超过预算时怎么截断？</button>
        <button class="panel-chip" onclick="askExample(this)">截断处为什么要留一行标注？</button>
        <button class="panel-chip" onclick="askExample(this)">命中行 ±300 行是怎么用的？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">生成与流式</div>
        <button class="panel-chip" onclick="askExample(this)">SSE 流式回答是怎么实现的？</button>
        <button class="panel-chip" onclick="askExample(this)">System 和 User 提示词各放什么？</button>
        <button class="panel-chip" onclick="askExample(this)">候选超过多少条会触发 DeepSeek 重排？</button>
        <button class="panel-chip" onclick="askExample(this)">没有 API Key 时哪条链路还能跑？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">配置与扩展</div>
        <button class="panel-chip" onclick="askExample(this)">换一个项目要改哪些配置？</button>
        <button class="panel-chip" onclick="askExample(this)">文件语义标签和项目背景在哪里改？</button>
        <button class="panel-chip" onclick="askExample(this)">RAG_SEMANTIC_TAGS 是干什么的？</button>
        <button class="panel-chip" onclick="askExample(this)">增量构建时为什么关键词索引要全量重建？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">测试与部署</div>
        <button class="panel-chip" onclick="askExample(this)">不装模型、不配 key 怎么跑测试？</button>
        <button class="panel-chip" onclick="askExample(this)">端到端 smoke test 用的是哪份语料和什么向量？</button>
        <button class="panel-chip" onclick="askExample(this)">服务怎么启动，默认端口是多少？</button>
      </div>
    </div>
  </aside>
</div>

<script>
  function askExample(el) {
    var input = document.getElementById('input');
    input.value = el.textContent;
    window.chatApp.sendMessage();
  }
</script>
<script src="js/markdown.js"></script>
<script src="js/streaming.js"></script>
<script src="js/app.js"></script>

</body>
</html>
