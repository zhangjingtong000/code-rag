<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>源代码智能问答 — RAG</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- Left Sidebar: History -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">问答记录</div>
      <div class="sidebar-subtitle">本次会话</div>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-empty">还没有提问，<br>输入问题开始</div>
    </div>
  </aside>

  <!-- Center: Chat -->
  <div id="main-col">
    <header>
      <div class="header-inner">
        <div class="header-brand">
          <div class="header-icon">{ }</div>
          <div>
            <div class="header-title">源代码问答</div>
            <div class="header-subtitle">RAG Code Intelligence</div>
          </div>
        </div>
        <div class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">检测中...</span>
        </div>
      </div>
    </header>

    <main id="messages">
      <div class="welcome-mini" id="welcome-mini">
        <span class="welcome-mini-icon">&#x276F;_</span>
        代码分析助手 — 可询问小程序项目、分支对比、RAG系统实现的任何代码问题
      </div>
    </main>

    <footer>
      <div class="input-wrap">
        <button id="mic-btn" title="按住说话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <textarea id="input" placeholder="询问关于项目代码的问题..." rows="1"></textarea>
        <button id="stop-btn" title="停止生成" style="display:none" onclick="window.chatApp.abort()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
        <button id="send-btn" title="发送 (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行 · 按住 🎤 语音输入 · 停止按钮中断生成</div>
    </footer>
  </div>

  <!-- Right Panel: Quick Questions -->
  <aside id="right-panel">
    <div class="panel-header">
      <div class="panel-title">快捷提问</div>
      <div class="panel-subtitle">点击直接发送</div>
    </div>
    <div class="panel-body">
      <div class="panel-section">
        <div class="panel-section-title">快速入门</div>
        <button class="panel-chip" onclick="askExample(this)">项目有哪些页面和功能？</button>
        <button class="panel-chip" onclick="askExample(this)">项目的整体技术架构是什么？</button>
        <button class="panel-chip" onclick="askExample(this)">main 和 release 分支有什么区别？</button>
        <button class="panel-chip" onclick="askExample(this)">后端有哪些 API 接口？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">场景识别</div>
        <button class="panel-chip" onclick="askExample(this)">场景识别现在用的是什么模型？</button>
        <button class="panel-chip" onclick="askExample(this)">识别 prompt 是怎么设计的？标签有什么要求？</button>
        <button class="panel-chip" onclick="askExample(this)">一次完整识别的数据流是怎样的？</button>
        <button class="panel-chip" onclick="askExample(this)">识别结果如何保存？图片压缩怎么做的？</button>
        <button class="panel-chip" onclick="askExample(this)">OCR 是怎么实现的？用的什么模型？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">AI 问答</div>
        <button class="panel-chip" onclick="askExample(this)">AI 问答的图片是怎么传给模型的？</button>
        <button class="panel-chip" onclick="askExample(this)">has_image 字段在前后端怎么传递的？</button>
        <button class="panel-chip" onclick="askExample(this)">无图片时 AI 怎么防止编造内容？</button>
        <button class="panel-chip" onclick="askExample(this)">云文件 ID 和远程 URL 怎么在问答中处理？</button>
        <button class="panel-chip" onclick="askExample(this)">重载按钮是怎么工作的？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">前端与登录</div>
        <button class="panel-chip" onclick="askExample(this)">登录和 openid 获取流程是怎样的？</button>
        <button class="panel-chip" onclick="askExample(this)">本地缓存和云数据库怎么协作？</button>
        <button class="panel-chip" onclick="askExample(this)">tabBar 的四个入口分别是什么？</button>
        <button class="panel-chip" onclick="askExample(this)">批量识别和图片对比怎么实现的？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">RAG 系统</div>
        <button class="panel-chip" onclick="askExample(this)">RAG 系统怎么向量检索代码的？</button>
        <button class="panel-chip" onclick="askExample(this)">混合检索和 RRF 融合逻辑是什么？</button>
        <button class="panel-chip" onclick="askExample(this)">代码分块和语义标签是怎么做的？</button>
        <button class="panel-chip" onclick="askExample(this)">索引构建的完整流程是什么？</button>
      </div>
      <div class="panel-section">
        <div class="panel-section-title">架构与安全</div>
        <button class="panel-chip" onclick="askExample(this)">后端做了哪些安全防护？</button>
        <button class="panel-chip" onclick="askExample(this)">release 分支上线做了哪些合规处理？</button>
        <button class="panel-chip" onclick="askExample(this)">前后端部署分别在哪里？环境变量怎么配置？</button>
      </div>
    </div>
  </aside>
</div>

<script>
  function askExample(el) {
    var input = document.getElementById('input');
    input.value = el.textContent;
    window.chatApp.sendMessage();
  }
</script>
<script src="js/markdown.js"></script>
<script src="js/streaming.js"></script>
<script src="js/app.js"></script>

</body>
</html>
